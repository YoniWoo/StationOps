<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StationOps — Évaluer un prestataire</title>
</head>
<body>
<header th:replace="~{fragments/entete
            :: entete(${utilisateurConnecte})}"></header>

<main>
  <h1>Évaluer l’intervention</h1>

  <p>
    Incident <span th:text="${incident.id}"></span> :
    <span th:text="${incident.description}"></span><br>
    Prestataire : <strong th:text="${incident.prestataireNom}"></strong>
  </p>

  <form th:action="@{/incidents/{id}/evaluation(id=${incident.id})}"
        th:object="${formulaire}" method="post">
    <fieldset>
      <legend>Note de 1 à 5</legend>
      <th:block th:each="valeur : ${#numbers.sequence(1, 5)}">
        <input type="radio" th:field="*{note}" th:value="${valeur}">
        <label th:for="${#ids.prev('note')}" th:text="${valeur}"></label>
      </th:block>
    </fieldset>
    <p th:if="${#fields.hasErrors('note')}" th:errors="*{note}" role="alert"></p>

    <p>
      <label for="commentaire">Commentaire (facultatif)</label><br>
      <textarea id="commentaire" th:field="*{commentaire}"
                rows="4" cols="60" maxlength="2000"></textarea>
    </p>
    <p th:if="${#fields.hasErrors('commentaire')}"
       th:errors="*{commentaire}" role="alert"></p>

    <button type="submit">Enregistrer l’évaluation</button>
  </form>

  <p>
    <a th:href="@{/incidents/{id}(id=${incident.id})}">Retour au détail</a>
  </p>
</main>
</body>
</html>
