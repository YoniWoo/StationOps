<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/entete :: tete('Modifier un incident')}"></head>
<body class="app">
<aside th:replace="~{fragments/entete :: menu(${utilisateurConnecte}, '')}"></aside>

<main class="contenu">
  <header th:replace="~{fragments/entete :: barre(${utilisateurConnecte}, |Incident n° ${incident.id}|)}"></header>

  <div class="entree formulaire-page">
    <div class="entete-page">
      <div>
        <h1>Modifier la description</h1>
        <p class="sous-titre">
          <span th:text="|Incident n° ${incident.id} · ${incident.equipementLibelle}|"></span>
          <span class="mono discret" th:text="${incident.equipementReference}"></span>
        </p>
      </div>
    </div>

    <section class="carte">
      <p class="info" th:if="${incident.resoluLe != null}" role="alert">
        Cet incident est résolu, sa description ne peut plus être modifiée
      </p>

      <form class="formulaire" th:if="${incident.resoluLe == null}"
            th:action="@{/incidents/{id}/modifier(id=${incident.id})}"
            th:object="${formulaire}" method="post">
        <label for="description">Description de la panne
          <textarea class="champ champ-bloc" id="description" th:field="*{description}"
                    rows="5" maxlength="2000"></textarea>
          <span class="erreur-champ" th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}" role="alert"></span>
        </label>

        <div class="actions">
          <button class="btn btn-principal" type="submit">Enregistrer</button>
          <a class="btn" th:href="@{/incidents/{id}(id=${incident.id})}">Annuler</a>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
