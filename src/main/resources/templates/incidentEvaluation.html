<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/entete :: tete('Évaluer un prestataire')}"></head>
<body class="app">
<aside th:replace="~{fragments/entete :: menu(${utilisateurConnecte}, '')}"></aside>

<main class="contenu">
  <header th:replace="~{fragments/entete :: barre(${utilisateurConnecte}, |Incident n° ${incident.id}|)}"></header>

  <div class="entree formulaire-page">
    <div class="entete-page">
      <div>
        <h1>Évaluer l’intervention</h1>
        <p class="sous-titre">
          <span th:text="${incident.prestataireNom}"></span>
          <span class="discret" th:text="| · incident n° ${incident.id}, ${incident.description}|"></span>
        </p>
      </div>
    </div>

    <section class="carte">
      <form class="formulaire" th:action="@{/incidents/{id}/evaluation(id=${incident.id})}"
            th:object="${formulaire}" method="post">
        <fieldset class="notes">
          <legend class="second" style="margin-bottom: 8px">Note de 1 à 5</legend>
          <th:block th:each="valeur : ${#numbers.sequence(1, 5)}">
            <input type="radio" th:field="*{note}" th:value="${valeur}">
            <label th:for="${#ids.prev('note')}" th:text="${valeur}"></label>
          </th:block>
        </fieldset>
        <span class="erreur-champ" th:if="${#fields.hasErrors('note')}" th:errors="*{note}" role="alert"></span>

        <label for="commentaire">Commentaire (facultatif)
          <textarea class="champ champ-bloc" id="commentaire" th:field="*{commentaire}"
                    rows="4" maxlength="2000"></textarea>
          <span class="erreur-champ" th:if="${#fields.hasErrors('commentaire')}"
                th:errors="*{commentaire}" role="alert"></span>
        </label>

        <div class="actions">
          <button class="btn btn-principal" type="submit">Enregistrer l’évaluation</button>
          <a class="btn" th:href="@{/incidents/{id}(id=${incident.id})}">Annuler</a>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
