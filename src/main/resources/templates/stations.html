<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/entete :: tete('Stations')}"></head>
<body class="app">
<aside th:replace="~{fragments/entete :: menu(${utilisateurConnecte}, 'stations')}"></aside>

<main class="contenu">
  <header th:replace="~{fragments/entete :: barre(${utilisateurConnecte}, 'Stations')}"></header>

  <div class="entree">
    <div class="entete-page">
      <h1>Stations du réseau</h1>
    </div>

    <section class="carte formulaire-page">
      <p class="info" th:if="${#lists.isEmpty(stations)}">
        Aucune station n’est disponible
      </p>

      <ul class="liste-liens" th:unless="${#lists.isEmpty(stations)}">
        <li th:each="station : ${stations}">
          <a th:href="@{/stations/{id}/equipements(id=${station.id})}">
            <span th:text="${station.nom}"></span>
            <span class="discret">Voir les équipements</span>
          </a>
        </li>
      </ul>
    </section>
  </div>
</main>
</body>
</html>
