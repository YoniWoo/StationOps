# base H2 en memoire pour lancer mvn test sans avoir MariaDB qui tourne
spring.datasource.url=jdbc:h2:mem:stationops;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# ici on laisse hibernate creer les tables vu que la base est vide a chaque fois
spring.jpa.hibernate.ddl-auto=create-drop
