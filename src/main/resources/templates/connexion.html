<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · StationOps</title>
  <link rel="stylesheet" th:href="@{/css/stationops.css}">
</head>
<body>
<main class="page-connexion">
  <div class="carte carte-connexion entree">
    <span class="logo"><span class="logo-panneau">S</span>StationOps</span>
    <h1>Connexion</h1>
    <p class="sous-titre" style="margin-bottom: 24px">Équipements des stations et suivi des incidents</p>

    <form class="formulaire" th:action="@{/login}" method="post">
      <p class="alerte" th:if="${param.error}" role="alert">
        L’adresse email ou le mot de passe est incorrect
      </p>
      <p class="info" th:if="${param.logout}" role="status">
        Vous avez été déconnecté
      </p>

      <label for="email">Adresse email
        <input class="champ" id="email" name="username" type="email"
               autocomplete="username" required autofocus>
      </label>

      <label for="motDePasse">Mot de passe
        <input class="champ" id="motDePasse" name="password" type="password"
               autocomplete="current-password" required>
      </label>

      <button class="btn btn-principal btn-bloc" type="submit">Se connecter</button>
    </form>
  </div>
</main>
</body>
</html>
