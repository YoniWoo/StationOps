<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/entete :: tete('Déclarer un incident')}"></head>
<body class="app">
<aside th:replace="~{fragments/entete :: menu(${utilisateurConnecte}, 'stations')}"></aside>

<main class="contenu">
  <header th:replace="~{fragments/entete :: barre(${utilisateurConnecte}, 'Déclarer un incident')}"></header>

  <div class="entree formulaire-page">
    <div class="entete-page">
      <div>
        <h1>Déclarer un incident</h1>
        <p class="sous-titre">
          <span th:text="${equipement.libelle}"></span>
          <span class="mono discret" th:text="${equipement.reference}"></span>
          <span class="discret" th:text="| · ${equipement.stationNom}|"></span>
        </p>
      </div>
    </div>

    <section class="carte">
      <form class="formulaire" th:action="@{/incidents/nouveau}" th:object="${formulaire}" method="post">
        <input type="hidden" th:field="*{equipementId}">

        <label for="description">Description de la panne
          <textarea class="champ champ-bloc" id="description" th:field="*{description}"
                    rows="5" maxlength="2000"></textarea>
          <span class="erreur-champ" th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}" role="alert"></span>
        </label>

        <p class="aide">L’équipement passe hors service dès la déclaration</p>

        <div class="actions">
          <button class="btn btn-principal" type="submit">Déclarer l’incident</button>
          <a class="btn" th:href="@{/equipements/{id}(id=${equipement.id})}">Annuler</a>
        </div>
      </form>
    </section>
  </div>
</main>
</body>
</html>
